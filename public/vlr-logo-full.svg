  <text x="200" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="url(#goldV)" letter-spacing="10">HOLDINGS</text>

  <!-- ── kasvukapital tagline ── -->
  <line x1="80" y1="428" x2="148" y2="428" stroke="url(#gold)" stroke-width="1"/>
  <text x="200" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="url(#gold)" letter-spacing="3">kasvukapital</text>
  <line x1="252" y1="428" x2="320" y2="428" stroke="url(#gold)" stroke-width="1"/>
