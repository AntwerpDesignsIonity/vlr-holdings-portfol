<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="35%" stop-color="#B08B3F"/>
      <stop offset="65%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#F0D080"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A040"/>
      <stop offset="50%" stop-color="#B08B3F"/>
